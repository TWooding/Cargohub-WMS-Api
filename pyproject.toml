[project]
name = "cargohub-wms-api"
version = "2.0.0"
description = "School project for Cargohub WMS API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.48",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "uv>=0.13.6",
    "ruff>=0.17.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-rxX"

[tool.ruff]
# legacy/ is the old stdlib-based implementation kept as reference only;
# it is not part of the deployed image (the Dockerfile copies app/ and tests/).
exclude = ["legacy"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is the idiomatic use of callables in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

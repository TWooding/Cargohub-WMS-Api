[project]
name = "cargohub-wms-api"
version = "0.1.0"
description = "School project for Cargohub WMS API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "sqlmodel>=0.0.48",
    "uv>=0.13.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api"]
addopts = "-rxX"

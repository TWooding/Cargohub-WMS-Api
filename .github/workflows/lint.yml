# Lints the Python code with Ruff (https://docs.astral.sh/ruff/).
# Ruff reads its configuration from [tool.ruff] in pyproject.toml:
# legacy/ is excluded (reference-only, not part of the Docker image) and
# FastAPI's Depends()/Query() are allowed in argument defaults.
name: Ruff

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.5" # pinned; bump deliberately to pick up new rules
